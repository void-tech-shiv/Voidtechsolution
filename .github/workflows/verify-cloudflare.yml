name: Validate Next.js and Cloudflare Worker

on:
  push:
    branches:
      - main
      - fix/cloudflare-build-20261119
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: voidtech_test_concurrency
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voidtech_test_concurrency"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:root@localhost:5432/voidtech_test_concurrency
      DIRECT_URL: postgresql://postgres:root@localhost:5432/voidtech_test_concurrency
      TEST_DATABASE_URL: postgresql://postgres:root@localhost:5432/voidtech_test_concurrency
      AUTH_SECRET: ci-only-random-placeholder-32-chars-long-not-for-production
      OTP_PEPPER_SECRET: ci-only-otp-pepper-placeholder
      SMTP_HOST: localhost
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: test-user
      SMTP_PASS: test-pass
      SMTP_FROM_EMAIL: notifications@example.com
      ADMIN_ALERT_EMAIL: admin@example.com
      NEXT_PUBLIC_SITE_URL: https://voidtechsolution.codedev.co.in

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install all dependencies including dev tools
        run: npm ci --include=dev

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Apply migrations to isolated local PostgreSQL
        run: npx prisma migrate deploy

      - name: Run unit and component tests
        run: npm test

      - name: Build Cloudflare Worker bundle
        run: npm run build:worker

      - name: Verify compiled OpenNext Worker artifact
        run: test -s .open-next/worker.js
